<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUFII-KING-MD</title>
<style>
body{background:#0f0f1a;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#1a1a2e;padding:30px;border-radius:20px;text-align:center;width:90%;max-width:400px;box-shadow:0 0 20px #000}
.logo{width:80px;height:80px;background:#6c5ce7;border-radius:50%;display:flex;justify-content:center;align-items:center;margin:0 auto 20px;font-size:40px}
h1{color:#a29bfe;margin:0}
input{width:90%;padding:15px;margin:20px 0;border-radius:10px;border:none;background:#2d2d44;color:white;font-size:18px;text-align:center}
button{width:100%;padding:15px;border-radius:10px;border:none;background:#6c5ce7;color:white;font-size:18px;font-weight:bold;cursor:pointer}
#result{margin-top:20px;font-size:22px;font-weight:bold;color:#00ff88;word-break:break-all}
</style>
</head>
<body>
<div class="card">
<div class="logo">⚡</div>
<h1>SUFII-KING-MD</h1>
<p>Generate Your Pairing Code</p>
<input type="text" id="number" placeholder="923218076693" value="923218076693">
<button id="btn" onclick="generate()">⚡ Generate Pair Code</button>
<div id="result"></div>
</div>
<script>
async function generate(){
 const num = document.getElementById('number').value;
 const btn = document.getElementById('btn');
 const resDiv = document.getElementById('result');
 if(!num){alert('Number dalo');return;}
 btn.innerText='Generating...'; btn.disabled=true;
 resDiv.innerText='';
 try{
  const response = await fetch('/api/pair', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({number: num})
  });
  const data = await response.json();
  if(data.code){
    resDiv.innerHTML = 'YOUR CODE:<br><span style="font-size:32px;letter-spacing:5px;">'+data.code+'</span><br><br>WhatsApp me ja ke Linked Device > Link with phone number > Code paste karo!';
  }else if(data.error){
    resDiv.innerText = 'Error: '+data.error;
  }else{
    resDiv.innerText = 'Error, try again';
  }
 }catch(e){
  resDiv.innerText='Server Error: '+e.message;
 }
 btn.innerText='⚡ Generate Pair Code'; btn.disabled=false;
}
</script>
</body>
</html>
