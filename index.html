<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUFI-KING-MD - FAST PAIR</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px}
.box{background:#111;border:2px solid #00ff00;border-radius:15px;padding:20px;max-width:400px;margin:30px auto}
input{width:90%;padding:15px;border-radius:10px;border:none;font-size:18px;text-align:center}
button{width:95%;padding:15px;margin-top:15px;background:#00ff00;color:#000;font-weight:bold;border:none;border-radius:10px;font-size:18px}
#result{margin-top:20px;font-size:22px;word-spacing:5px}
</style>
</head>
<body>
<h1>🐍 SUFI-KING-MD 🐍</h1>
<h3 style="color:#00ff00">FAST PAIR - 1 SECOND</h3>
<div class="box">
<input id="num" placeholder="923218076693" type="number">
<button onclick="fastPair()">GET PAIR CODE - FAST</button>
<div id="result"></div>
</div>

<script>
async function fastPair(){
 let n = document.getElementById('num').value.replace(/[^0-9]/g,"");
 if(!n) return alert("Number likho yaar!");
 document.getElementById('result').innerHTML = "⏳ Connecting... SUFI KING...";
 try{
  let r = await fetch(`https://suhail-md-vtsf.onrender.com/code?number=${n}`);
  let d = await r.json();
  if(d.code){
   document.getElementById('result').innerHTML = `<div style="background:#fff;color:#000;padding:15px;border-radius:10px;font-weight:bold;letter-spacing:5px;font-size:28px">${d.code}</div><br><p style="font-size:14px">WhatsApp > Linked Devices > Link with phone number me dalo<br><b>20 sec ke andar!</b></p>`;
  } else {
   document.getElementById('result').innerHTML = "Error: " + JSON.stringify(d);
  }
 } catch(e){
  document.getElementById('result').innerHTML = "Server thanda hai, 10 sec baad dobara dabao!";
 }
}
</script>
</body>
</html>
