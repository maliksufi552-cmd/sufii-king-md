
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUFI-KING-MD</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px}
.box{background:#111;border:2px solid #00ff00;border-radius:15px;padding:20px;max-width:400px;margin:30px auto}
input{width:90%;padding:15px;border-radius:10px;border:none;font-size:18px;text-align:center}
button{width:95%;padding:15px;margin-top:15px;background:#00ff00;color:#000;font-weight:bold;border:none;border-radius:10px;font-size:18px;cursor:pointer}
#result{margin-top:20px;font-size:22px;word-break:break-all}
</style>
</head>
<body>
<h1>👑 SUFI-KING-MD 👑</h1>
<h3 style="color:#00ff00">FAST PAIR - 1 SECOND</h3>
<div class="box">
<input id="num" placeholder="923247761728" type="number">
<button onclick="fastPair()">GET PAIR CODE - FAST</button>
<div id="result"></div>
</div>
<script>
async function fastPair(){
 let n=document.getElementById('num').value.replace(/[^0-9]/g,"");
 if(!n) return alert("Number likho!");
 let r=document.getElementById('result');
 r.innerHTML="⏳ SUFI-KING Connecting...";

 const apis=[
   `https://suhail-md-pair.onrender.com/code?number=${n}`,
   `https://jawad-md-pair.onrender.com/code?number=${n}`,
   `https://suhail-md-vtsf.onrender.com/code?number=${n}`
 ];

 for(let api of apis){
  try{
   let res=await fetch(api);
   let d=await res.json();
   if(d.code || d.paircode || d.pair_code){
    let code=d.code||d.paircode||d.pair_code;
    r.innerHTML=`<div style="background:#fff;color:#000;padding:15px;border-radius:10px;font-weight:bold;letter-spacing:5px;font-size:28px">${code}</div><br><p style="font-size:14px">WhatsApp > Linked Devices > Link with phone number<br><b>20 sec me dalo!</b></p>`;
    return;
   }
  }catch(e){ console.log("try next",api); }
 }
 r.innerHTML="⚠️ Sab servers busy hain! 30 sec baad try karo, SUFI KING! 2-3 baar dabao to code aayega!";
}
</script>
</body>
</html>
