<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUFI-KING-MD</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;padding:20px}
.box{border:2px solid #0f0;border-radius:15px;padding:20px;max-width:400px;margin:30px auto}
input,button{width:90%;padding:15px;border-radius:10px;border:none;font-size:18px;margin-top:10px}
button{background:#0f0;color:#000;font-weight:bold}
#r{margin-top:20px;font-size:24px;word-break:break-all}
</style>
</head>
<body>
<h1>👑 SUFI-KING-MD 👑</h1>
<h3 style="color:#0f0">FAST PAIR</h3>
<div class="box">
<input id="num" placeholder="923247761728" type="number">
<button onclick="pair()">GET PAIR CODE</button>
<div id="r"></div>
</div>
<script>
async function pair(){
 let n=document.getElementById('num').value.replace(/[^0-9]/g,"");
 if(!n)return alert("Number likho!");
 document.getElementById('r').innerHTML="⏳ Logging in... 15 sec...";
 try{
  let res=await fetch(`/api/pair?number=${n}`);
  let d=await res.json();
  if(d.code){
   document.getElementById('r').innerHTML=`<div style="background:#fff;color:#000;padding:15px;border-radius:10px;font-weight:bold;font-size:28px;letter-spacing:4px">${d.code}</div><p style="font-size:14px;margin-top:10px">WhatsApp > Linked Devices > Link with phone number</p>`;
  } else {
   document.getElementById('r').innerHTML=d.error||"Error";
  }
 }catch(e){
  document.getElementById('r').innerHTML="Error, 20 sec baad try karo!";
 }
}
</script>
</body>
</html>
